<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Norseman AI Demo</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; }

      /* Floating launcher button */
      #va-launcher {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 9999;
        border: none;
        border-radius: 999px;
        padding: 12px 16px;
        background: #111827;
        color: white;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0,0,0,.2);
        font-weight: 600;
      }

      /* Panel */
      #va-panel {
        position: fixed;
        right: 20px;
        bottom: 72px;
        width: 360px;
        max-width: calc(100vw - 40px);
        height: 520px;
        max-height: calc(100vh - 120px);
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        z-index: 9999;
        box-shadow: 0 20px 50px rgba(0,0,0,.25);
        display: none;
        overflow: hidden;
      }

      #va-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-bottom: 1px solid #e5e7eb;
        background: #f9fafb;
      }

      #va-modes {
        display: flex;
        gap: 8px;
      }

      .va-tab {
        border: 1px solid #e5e7eb;
        background: white;
        padding: 6px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 13px;
      }
      .va-tab.active {
        background: #111827;
        color: white;
        border-color: #111827;
      }

      #va-close {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }

      #va-body {
        height: calc(100% - 48px);
        display: flex;
        flex-direction: column;
      }

      #va-log {
        flex: 1;
        padding: 12px;
        overflow: auto;
        background: #ffffff;
      }

      .msg { margin: 0 0 10px 0; font-size: 14px; line-height: 1.35; }
      .msg .role { font-weight: 700; font-size: 12px; text-transform: uppercase; color: #6b7280; }
      .msg .text { white-space: pre-wrap; }

      #va-voice {
        display: none;
        padding: 12px;
        border-top: 1px solid #e5e7eb;
        background: #fafafa;
      }

      #va-chat {
        display: none;
        padding: 12px;
        border-top: 1px solid #e5e7eb;
        background: #fafafa;
      }

      #va-chat form { display: flex; gap: 8px; }
      #va-chat input {
        flex: 1;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        padding: 10px;
        font-size: 14px;
      }
      #va-chat button, #va-voice button {
        border: none;
        border-radius: 10px;
        padding: 10px 12px;
        background: #111827;
        color: white;
        cursor: pointer;
        font-weight: 600;
      }

      #va-status {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
      }
    </style>
  </head>

  <body>
    <h1>Norseman — Virtual Assistant Alex (Demo)</h1>
    <p>Use the button in the bottom-right to talk (voice) or chat (text).</p>

    <button id="va-launcher">Talk to Alex</button>

    <div id="va-panel" role="dialog" aria-label="Norseman Virtual Assistant">
      <div id="va-header">
        <div>
          <div style="font-weight:700;">Alex</div>
          <div style="font-size:12px;color:#6b7280;">Norseman Virtual Assistant</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <div id="va-modes">
            <button class="va-tab active" id="tab-voice" type="button">Voice</button>
            <button class="va-tab" id="tab-chat" type="button">Chat</button>
          </div>
          <button id="va-close" type="button" aria-label="Close">×</button>
        </div>
      </div>

      <div id="va-body">
        <div id="va-log"></div>

        <div id="va-voice">
          <button id="btn-voice-toggle" type="button">Start voice</button>
          <div id="va-status">Mic required for voice.</div>
        </div>

        <div id="va-chat">
          <form id="chat-form">
            <input id="chat-input" type="text" placeholder="Type a message…" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
          <div id="va-status-chat"></div>
        </div>
      </div>
    </div>

    <script type="module">
      import Vapi from "https://cdn.jsdelivr.net/npm/@vapi-ai/web@latest/dist/vapi-web.esm.js";

      const PUBLIC_KEY = "81937275-a97b-4e1e-8f52-299e25d4668b";
      const ASSISTANT_ID = "74795584-111b-4f69-9223-78b555d26a10";

      const vapi = new Vapi(PUBLIC_KEY);

      const launcher = document.getElementById("va-launcher");
      const panel = document.getElementById("va-panel");
      const closeBtn = document.getElementById("va-close");

      const tabVoice = document.getElementById("tab-voice");
      const tabChat = document.getElementById("tab-chat");
      const voiceSection = document.getElementById("va-voice");
      const chatSection = document.getElementById("va-chat");

      const log = document.getElementById("va-log");

      const voiceToggle = document.getElementById("btn-voice-toggle");
      let voiceActive = false;

      const chatForm = document.getElementById("chat-form");
      const chatInput = document.getElementById("chat-input");

      function addMsg(role, text) {
        const wrap = document.createElement("div");
        wrap.className = "msg";
        wrap.innerHTML = `<div class="role">${role}</div><div class="text">${escapeHtml(text)}</div>`;
        log.appendChild(wrap);
        log.scrollTop = log.scrollHeight;
      }

      function escapeHtml(str) {
        return (str ?? "").replace(/[&<>"']/g, (m) => ({
          "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
        }[m]));
      }

      function openPanel() {
        panel.style.display = "block";
        // default to voice UI
        setMode("voice");
      }

      function closePanel() {
        panel.style.display = "none";
      }

      function setMode(mode) {
        if (mode === "voice") {
          tabVoice.classList.add("active");
          tabChat.classList.remove("active");
          voiceSection.style.display = "block";
          chatSection.style.display = "none";
        } else {
          tabChat.classList.add("active");
          tabVoice.classList.remove("active");
          chatSection.style.display = "block";
          voiceSection.style.display = "none";
          chatInput.focus();
        }
      }

      launcher.addEventListener("click", openPanel);
      closeBtn.addEventListener("click", closePanel);
      tabVoice.addEventListener("click", () => setMode("voice"));
      tabChat.addEventListener("click", () => setMode("chat"));

      // Voice start/stop
      voiceToggle.addEventListener("click", async () => {
        try {
          if (!voiceActive) {
            addMsg("system", "Starting voice…");
            await vapi.start(ASSISTANT_ID);
            voiceActive = true;
            voiceToggle.textContent = "Stop voice";
          } else {
            addMsg("system", "Stopping voice…");
            vapi.stop();
            voiceActive = false;
            voiceToggle.textContent = "Start voice";
          }
        } catch (e) {
          addMsg("error", (e && e.message) ? e.message : String(e));
        }
      });

      // Live transcripts/messages
      vapi.on("message", (message) => {
        if (message.type === "transcript") {
          // message.role: "user" | "assistant"
          // message.transcriptType: "partial" | "final"
          if (message.transcriptType === "final" && message.transcript) {
            addMsg(message.role, message.transcript);
          }
        }
      });

      vapi.on("error", (e) => addMsg("error", e?.message ?? String(e)));

      // Chat (text): use Vapi REST /chat endpoint via fetch
      let previousChatId = null;

      chatForm.addEventListener("submit", async (evt) => {
        evt.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = "";

        addMsg("user", text);

        try {
          const res = await fetch("https://api.vapi.ai/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${PUBLIC_KEY}`
            },
            body: JSON.stringify({
              assistantId: ASSISTANT_ID,
              input: text,
              previousChatId
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data?.message ? JSON.stringify(data.message) : "Chat request failed");

          previousChatId = data.id;
          const out = data.output?.[0]?.content ?? "(no response)";
          addMsg("assistant", out);
        } catch (e) {
          addMsg("error", e?.message ?? String(e));
        }
      });
    </script>
  </body>
</html>
